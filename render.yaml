services:
  - type: web
    name: sverkai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: sverkai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
